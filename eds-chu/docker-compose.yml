services:

  # HTTP 8123 (pipeline + Metabase), natif 9000, play : http://localhost:8123/play
  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # http://localhost:3001
  # Driver ClickHouse : ./metabase-plugins/clickhouse.metabase-driver.jar
  # Connexions : docker compose exec pipeline python -m pipeline.metabase_setup
  #   host = clickhouse (réseau Docker, pas localhost)
  #   comptes eds_pilotage / eds_recherche — pas default
  metabase:
    image: metabase/metabase:v0.53.4
    ports:
      - "3001:3000"
    volumes:
      - metabase_data:/metabase-data
      - ./metabase-plugins:/plugins
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_PLUGINS_DIR: /plugins
      JAVA_TIMEZONE: Europe/Paris
    depends_on:
      clickhouse:
        condition: service_healthy

  # Relance quotidienne (cron 06:00 Europe/Paris) + un run au démarrage.
  # Logs : docker compose logs -f pipeline
  # Run manuel : docker compose exec pipeline python -m pipeline.run
  pipeline:
    build: .
    env_file: .env
    environment:
      TZ: Europe/Paris
      CLICKHOUSE_HOST: clickhouse
      SOURCE_DIR: /data/source
      LAKE_DIR: /data/lake
      METABASE_URL: http://metabase:3000
      CRON_SCHEDULE: "${CRON_SCHEDULE:-0 6 * * *}"
      RUN_ON_START: ${RUN_ON_START:-1}
    volumes:
      - type: bind
        source: ${SOURCE_DIR}
        target: /data/source
        read_only: true
      - type: bind
        source: ${LAKE_DIR}
        target: /data/lake
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clickhouse_data:
  metabase_data:
